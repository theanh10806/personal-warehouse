
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,excel]"
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/personal_warehouse/webui/static/app.js
      - run: node --test tests/map_ui.test.cjs
