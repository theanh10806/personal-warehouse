<!doctype html>
<html lang="vi" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Personal Warehouse</title>
<link rel="icon" href="icon.png"/>
<link rel="stylesheet" href="app.css"/>
</head>
<body>

 <symbol id="i-box" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L20 7 v10 L12 21 L4 17 V7 Z"/><path d="M4 7 L12 11 L20 7 M12 11 V21"/></g></symbol>
 <symbol id="i-tag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5 h7 l9 9 -7 7 -9 -9 Z"/><circle cx="8.5" cy="9.5" r="1.6"/></g></symbol>
 <symbol id="i-mv" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8 L17 8 M14 5 l3 3 -3 3"/><path d="M17 16 L7 16 M10 13 l-3 3 3 3"/></g></symbol>
 <symbol id="i-scan" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8 V5 a1 1 0 0 1 1 -1 h3 M16 4 h3 a1 1 0 0 1 1 1 v3 M20 16 v3 a1 1 0 0 1 -1 1 h-3 M8 20 H5 a1 1 0 0 1 -1 -1 v-3"/><path d="M8 12 h8"/></g></symbol>
 <symbol id="i-map" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21 c0 0 6 -5.5 6 -10 a6 6 0 1 0 -12 0 c0 4.5 6 10 6 10 Z"/><circle cx="12" cy="11" r="2.4"/></g></symbol>

 <symbol id="i-menu" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7 h16 M4 12 h16 M4 17 h16"/></g></symbol>
 <symbol id="i-moon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5 A8.5 8.5 0 1 1 9.5 4 a6.8 6.8 0 0 0 10.5 10.5 Z"/></g></symbol>
 <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5 v2.5 M12 19 v2.5 M2.5 12 H5 M19 12 h2.5 M5.3 5.3 l1.8 1.8 M16.9 16.9 l1.8 1.8 M18.7 5.3 l-1.8 1.8 M7.1 16.9 l-1.8 1.8"/></g></symbol>
 <symbol id="i-plus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5 v14 M5 12 h14"/></g></symbol>
 <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></g></symbol>
 <symbol id="i-print" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9 V4 h10 v5 M7 17 H5 a1 1 0 0 1 -1 -1 v-6 a1 1 0 0 1 1 -1 h14 a1 1 0 0 1 1 1 v6 a1 1 0 0 1 -1 1 h-2"/><rect x="7" y="14" width="10" height="6" rx="1"/></g></symbol>

 <symbol id="i-img" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.7"/><path d="M4 18 l5 -5 4 4 3 -3 4 4"/></g></symbol>
 <symbol id="i-edit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 h4 L19 9 a2.1 2.1 0 0 0 -4 -4 L4 16 Z M14 6 l4 4"/></g></symbol>
 <symbol id="i-archive" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="4.5" rx="1"/><path d="M5 9 v9 a1.5 1.5 0 0 0 1.5 1.5 h11 A1.5 1.5 0 0 0 19 18 V9 M10 13 h4"/></g></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 l4.5 4.5 L19 7.5"/></g></symbol>
 <symbol id="i-alert" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 L21 19 H3 Z M12 10 v4 M12 16.6 v.4"/></g></symbol>
 <symbol id="i-trend" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16 l5 -5 4 3 7 -8 M15 6 h5 v5"/></g></symbol>
 <symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.2"/></g></symbol>
 <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
 <symbol id="i-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 7 8 6 8-6"/></g></symbol>
 <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 7.5 V12 l3 2"/></g></symbol>
 <symbol id="i-dollar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 v17 M16.5 7.5 c-.8 -1.4 -2.4 -2 -4.5 -2 c-2.6 0 -4 1.2 -4 3 c0 4.2 9 2 9 6.4 c0 1.9 -1.8 3.2 -4.5 3.2 c-2.2 0 -3.9 -.8 -4.7 -2.2"/></g></symbol>
 <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7 h16 M9 7 V4.5 h6 V7 M6.5 7 l1 12.5 h9 l1 -12.5 M10 11 v5 M14 11 v5"/></g></symbol>
 <symbol id="i-x" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6 l12 12 M18 6 L6 18"/></g></symbol>
 <symbol id="i-sort" viewBox="0 0 24 24"><g fill="currentColor"><path d="M12 6 l4 5 H8 Z"/></g></symbol>
 <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12 h17 M12 3.5 c3 3 3 14 0 17 M12 3.5 c-3 3 -3 14 0 17"/></g></symbol>
</defs>
</svg>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="logo">
      <div class="logo-mark"><svg><use href="#i-box"/></svg></div>
      <div class="logo-text"><b id="brandName"></b><small id="brandSub"></small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="iconbtn" id="burger" type="button"><svg><use href="#i-menu"/></svg></button>
      <form class="search" id="searchForm" role="search">
        <svg class="ico"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" autocomplete="off"/>
      </form>
      <div class="spacer"></div>
      <div class="seg" id="langSeg" role="group"></div>
      <button class="iconbtn" id="themeBtn" type="button"><svg><use href="#i-moon"/></svg></button>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="overlay" id="overlay" hidden></div>

<script src="app.js"></script>
</body>
</html>
